# ────────────────────────────────────────────────────────────
# 这个文件是一份说明，不是可用的部署配置。
#
# 原因：写作台是本地 Node 服务，三个硬依赖 Cloudflare 都提供不了：
#   1. 本地文件系统读写 —— data/ 下的 json 是直接 writeFileSync 到磁盘的
#      Workers 没有 FS，需要换成 D1 或 KV，是一次重写不是改配置
#   2. Node 运行时 —— server.mjs 直接跑在 node:http 上，
#      Workers 是 V8 isolate，模块 API 完全不同
#   3. 出站抓取 —— 热点榜抓取依赖实时访问源站，
#      Workers 出站有配额限制，且源站多数要处理 CORS 与反爬
#
# 现在能做的：把仓库同步到 GitHub 作代码备份（见 部署说明.md）。
# 要真正公网访问，需要一次架构改造，见 docs/部署方案.md。
# ────────────────────────────────────────────────────────────
name = "xiezuotai"
compatibility_date = "2026-10-03"
# main 故意留空：本项目当前不可部署到 Workers
